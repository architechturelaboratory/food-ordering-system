apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-ordering-app
  namespace: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: food-ordering-app
  template:
    metadata:
      labels:
        app: food-ordering-app
    spec:
      containers:
      - name: food-ordering-app
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: food-ordering-app
  namespace: development
spec:
  selector:
    app: food-ordering-app
  ports:
  - port: 80
    targetPort: 80
