apiVersion: apps/v1
kind: Deployment
metadata:
  name: sr
  namespace: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sr
  template:
    metadata:
      labels:
        app: sr
    spec:
      containers:
        - name: sr
          image: confluentinc/cp-schema-registry:7.7.0
          ports:
            - containerPort: 8081
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              value: sr
            - name: SCHEMA_REGISTRY_LISTENERS
              value: http://0.0.0.0:8081
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: PLAINTEXT://kafka-broker-1:9092,PLAINTEXT://kafka-broker-2:9092,PLAINTEXT://kafka-broker-3:9092
            - name: SCHEMA_REGISTRY_DEBUG
              value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: sr
  namespace: development
spec:
  selector:
    app: sr
  ports:
    - port: 8081
      targetPort: 8081