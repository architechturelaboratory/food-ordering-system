apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: local
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: kafka-broker-1:9092,kafka-broker-2:9092,kafka-broker-3:9092
            - name: KAFKA_CLUSTERS_0_SCHEMAREGISTRY
              value: http://sr:8081
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: development
spec:
  selector:
    app: kafka-ui
  ports:
    - port: 9000
      targetPort: 8080