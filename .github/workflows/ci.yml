name: CI — Build & Push Images

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

env:
  REGISTRY: ghcr.io
  GITHUB_USER: architechturelaboratory

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set version
        id: version
        run: |
          PROJECT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "project_version=${PROJECT_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${PROJECT_VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push images
        env:
          PROJECT_VERSION: ${{ steps.version.outputs.project_version }}
          TAG: ${{ steps.version.outputs.tag }}
          GITHUB_USER: ${{ env.GITHUB_USER }}
        run: |
          mvn clean install -DskipTests -Pbuild-docker-image

          docker tag com.food.ordering.system/order.service:$PROJECT_VERSION      ghcr.io/$GITHUB_USER/order-service:$TAG
          docker tag com.food.ordering.system/payment.service:$PROJECT_VERSION    ghcr.io/$GITHUB_USER/payment-service:$TAG
          docker tag com.food.ordering.system/restaurant.service:$PROJECT_VERSION ghcr.io/$GITHUB_USER/restaurant-service:$TAG
          docker tag com.food.ordering.system/customer.service:$PROJECT_VERSION   ghcr.io/$GITHUB_USER/customer-service:$TAG

          docker push ghcr.io/$GITHUB_USER/order-service:$TAG
          docker push ghcr.io/$GITHUB_USER/payment-service:$TAG
          docker push ghcr.io/$GITHUB_USER/restaurant-service:$TAG
          docker push ghcr.io/$GITHUB_USER/customer-service:$TAG

      - name: Set deploy environment
        id: env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
          fi

      - name: Update image tags in deployment repo
        if: github.event_name == 'push'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
          GITHUB_USER: ${{ env.GITHUB_USER }}
        run: |
          git clone https://x-access-token:${DEPLOY_REPO_TOKEN}@github.com/${GITHUB_USER}/food-ordering-cluster-deployment.git deploy-repo
          cd deploy-repo
          
          sed -i "s|ghcr.io/${GITHUB_USER}/order-service:.*|ghcr.io/${GITHUB_USER}/order-service:${TAG}|" \
            services/order-service/deployment.yaml
          
          # payment/restaurant/customer için deployment.yaml ekledikçe sed satırları buraya gelecek
          
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git add .
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "ci: update image tags to ${TAG} [skip ci]"
          git push