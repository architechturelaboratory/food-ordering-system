name: CI — Build & Push Images

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

env:
  REGISTRY: ghcr.io
  GITHUB_USER: architechturelaboratory
  VERSION: 1.0-SNAPSHOT

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push images
        env:
          VERSION: ${{ env.VERSION }}
          GITHUB_USER: ${{ env.GITHUB_USER }}
        run: |
          mvn clean install -DskipTests -Pbuild-docker-image

          docker tag com.food.ordering.system/order.service:$VERSION ghcr.io/$GITHUB_USER/order-service:$VERSION
          docker tag com.food.ordering.system/payment.service:$VERSION ghcr.io/$GITHUB_USER/payment-service:$VERSION
          docker tag com.food.ordering.system/restaurant.service:$VERSION ghcr.io/$GITHUB_USER/restaurant-service:$VERSION
          docker tag com.food.ordering.system/customer.service:$VERSION ghcr.io/$GITHUB_USER/customer-service:$VERSION

          docker push ghcr.io/$GITHUB_USER/order-service:$VERSION
          docker push ghcr.io/$GITHUB_USER/payment-service:$VERSION
          docker push ghcr.io/$GITHUB_USER/restaurant-service:$VERSION
          docker push ghcr.io/$GITHUB_USER/customer-service:$VERSION

      - name: Set deploy environment
        id: env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
          fi